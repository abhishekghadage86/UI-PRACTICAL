<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio tag</title>
    <style>
        *
        {
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }
        .box
        {
            width: 80%;
            margin: auto;
           position: relative;
           border: solid 1px black;
           min-height: 500px;
           background-color: rgb(190, 42, 42);
        }
        audio
        {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
    </style>
</head>
<body>
    <div class="box">
        <audio controls autoplay muted>
            <source src="/AUDIO/Chhupana_Bhi_Nahin_Aata-Vinod_Rathod.mp3">
        </audio>
    </div>
   
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<style>
    *
    {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Roboto Slab", serif;

    }
    section
    {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
      
        background-image:  url(/IMAGE/logocurve.png),linear-gradient(180deg,#2c3e50,#3498db);
        background-repeat: no-repeat;
        background-blend-mode: screen;
    
    }
    .box
    {
        width: 100;
    }
    .box h1
    {
        font-size: 8ch;
        color: white;
        padding:0 80px;
    }
    .box p
    {
        font-weight: 500;
        color: white;
        font-size: larger;
        padding:10px 30px;
    }
    section img
    { 
        position: relative;
         max-width: 450px;
         margin-top: 150px;
         z-index: 1; 
         top: 60px;
    }
    .custom-shape-divider-bottom-1720445820 {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    overflow:hidden;
    line-height: 0;
    transform: rotate(180deg);
}

.custom-shape-divider-bottom-1720445820 svg {
    position: relative;
    display: block;
    width: calc(100% + 1.3px);
    height: 150px;
}

.custom-shape-divider-bottom-1720445820 .shape-fill {
    fill: #FFFFFF;
}
.wave
{
    position: absolute; 
    left: 0; 
    bottom: 0;
}
.nav
{
    position: absolute;
    top: 0;
    right: 20px;
}
.nav ul li
{
    list-style: none;
    display: inline-block;
    padding-top: 30px;
}
.nav ul li a
{
    text-decoration: none;
    padding: 15px;
    color: white;
    font-weight: bold;
    font-size: large;
}
.nav ul li a:hover
{
    background-color: #3383BA;
    color: white;
    border-radius: 50px;
   
}
#img1
{
    position: absolute;
    max-width: 100px;
    top: -150px;
    left: 30px;
}
</style>
<body>
    <section>
        <div class="nav">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About us</a></li>
                <li><a href="">Blogs</a></li>
                <li><a href="">Join</a></li>
                <li><a href="">Menu</a></li>
                <li><a href="">Jobs</a></li>
            </ul>
        </div>
        <div class="box">
            <h1>Company name</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Officiis dolorum deserunt iure enim atque soluta!</p>
        </div>
        <img src="/IMAGE/logocurve.png"  alt="">
        <img src="/IMAGE/l.png" id="img1" alt="">
        <div class="custom-shape-divider-bottom-1720445820">
            <svg class="wave" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
    </section>

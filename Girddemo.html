<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box
        {
            width: 80%;
            margin: auto;
            border: solid 1px black;
            display: grid;
            grid-template-columns: repeat(4,1fr);
           
            grid-template-rows: 150px 150px 150px;
            grid-gap: 10px;
            grid-auto-rows: 100px ;
            
            
        }
        .item1
        {
            background-color: #6EBE4F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-row: 1/-1;
        }
        .item2
        {
            background-color: #6EBE4F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 2/4;
        }
        .item3
        {
            background-color: #EC3436;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 5/-2;
        }
        .item4
        {
            background-color: #EC3436;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-template-columns: 100px;
        }
        .item5
        {
            background-color: #FBB22F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item6
        {
            background-color: #6EBE4F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
           grid-row: span 2;
            
            
        }
        .item7
        {
            background-color: #FBB22F;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-area: 3;
        }
        .item8
        {
            background-color: #EC3436;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            
            
        }
        

    </style>
</head>
<body>
    <div class="box">
        
        <div class="item1">Box1</div>
        <div class="item2">Box2</div>
        <div class="item3">Box3</div>
        <div class="item4">Box4</div>
        <div class="item5">Box5</div>
        <div class="item6">Box6</div>
        <div class="item7">Box7</div>
        <div class="item8">Box8</div>
    </div>
</body>
</html>

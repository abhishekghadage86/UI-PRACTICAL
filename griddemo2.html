<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *
        {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box
        {
            width: 80%;
            margin: auto;
            border: solid 1px black;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows:  60px 400px ;
            grid-gap: 10px;
            grid-auto-rows: 100px;
        }
        .item1
        {
            background-color: #785EDD;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 1/-1;

        }
        .item2
        {
            background-color: #2f631f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-row: span 3;
        }
        .item3
        {
            background-color: #16856d;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: span 2;
        }
        .item4
        {
            background-color: #9fd312;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-row: span 2;
        }
        .item5
        {
            background-color: #910505;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-row: span 2;
        }
        .item6
        {
            background-color: #0924c0;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <div class="box">
    <div class="item1">Header</div>
    <div class="item2">Slidebar</div>
    <div class="item3">Content-1</div>
    <div class="item4">Content-2</div>
    <div class="item5">Content-3</div>
    <div class="item6">Footer</div>
    </div>
    
</body>
</html>
